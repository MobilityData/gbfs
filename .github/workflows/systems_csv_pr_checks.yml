name: systems.csv PR checks

# Runs whenever a pull request adds or changes systems.csv, this workflow, or the scripts it runs.
#   1. sort              - same-repo branches: re-sort the file and push the result as a separate commit. Fork PRs: fail if the file is not sorted, with instructions to run the sorter on the fork (see below).
#   2. validate-structure- fail on malformed rows / missing required values.
#   3. check-new-urls    - fail if any newly added URL does not return HTTP 200-299.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - systems.csv
      - .github/workflows/systems_csv_pr_checks.yml
      - scripts/sort-systems-csv.js
      - scripts/validate-systems-csv.js
      - scripts/check-new-urls.js

# Cancel superseded runs when new commits are pushed to the same PR.
concurrency:
  group: systems-csv-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sort:
    name: Sort systems.csv
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN cannot push to a forked repository, so auto-sorting is limited to branches in this repo. Fork PRs get a check-only pass instead: the job fails if systems.csv is not sorted, shows the diff sorting would apply, and tells the contributor how to sort it on their fork. Both paths run in this one job so the PR always shows a single "Sort systems.csv" check (a skipped job would count as passing under branch protection).
    permissions:
      contents: write
    env:
      IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout PR branch (same repo)
        if: env.IS_FORK == 'false'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR head (fork)
        if: env.IS_FORK == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Check sort order (fork)
        if: env.IS_FORK == 'true'
        run: |
          if node scripts/sort-systems-csv.js --check systems.csv; then
            exit 0
          fi
          # Sort a copy in place only to show the contributor what would change; nothing is pushed.
          node scripts/sort-systems-csv.js systems.csv > /dev/null
          echo "::error file=systems.csv,title=systems.csv is not sorted::Pull requests from forks cannot be sorted automatically. On your fork, from the repository root, run either 'node scripts/sort-systems-csv.js' (Node.js) or './scripts/sort-systems-csv.sh' (bash only, no Node.js needed). Both produce the same order. Then commit the result and push to update this pull request. The job log shows the changes sorting will make."
          echo "Changes sorting would make to systems.csv:"
          git --no-pager diff -- systems.csv
          exit 1

      - name: Sort systems.csv
        if: env.IS_FORK == 'false'
        run: node scripts/sort-systems-csv.js systems.csv

      - name: Commit sorted file if it changed
        if: env.IS_FORK == 'false'
        run: |
          if git diff --quiet -- systems.csv; then
            echo "systems.csv already sorted; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add systems.csv
          git commit -m "chore: sort systems.csv"
          git push origin "HEAD:${{ github.head_ref }}"

  validate-structure:
    name: Validate structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Validate systems.csv structure
        run: node scripts/validate-systems-csv.js systems.csv

  check-new-urls:
    name: Check new URLs return 2xx
    runs-on: ubuntu-latest
    # Only spend network requests once the file is known to be well-formed.
    needs: validate-structure
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Extract base systems.csv
        run: |
          git show "${{ github.event.pull_request.base.sha }}:systems.csv" > /tmp/systems.base.csv 2>/dev/null \
            || : > /tmp/systems.base.csv
      - name: Check newly added URLs
        run: node scripts/check-new-urls.js /tmp/systems.base.csv systems.csv
